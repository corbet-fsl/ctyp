[package]
name = "ctyp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Document library over ctypst and cletter: papers, fonts, blocks, correspondence, rendering, measurement, PDF"
license = "FSL-1.1-ALv2"
repository = "https://git.corbet.ch/corbet-fsl/ctyp"
readme = "README.md"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = ["pdf", "pdf-normalize", "svg", "measure"]
pdf = ["ctypst/pdf"]
# Locale-identifier normalization of exported PDFs (lopdf pulls getrandom: not in the wasm build).
pdf-normalize = ["pdf", "dep:lopdf", "dep:regex"]
svg = ["ctypst/svg"]
raster = ["ctypst/raster"]
measure = ["ctypst/measure"]
format = ["ctypst/format"]
# wasm32 package (build with `--crate-type cdylib`, see scripts/wasm.sh): ctypst's `Ctypst`
# runtime exports plus ctyp's own helpers.
wasm = ["ctypst/wasm", "pdf", "svg", "measure", "dep:wasm-bindgen"]

[dependencies]
cletter = "0.4"
ctypst = { version = "0.3", default-features = false, features = ["document-fonts"] }
lopdf = { version = "0.44", optional = true, default-features = false }
regex = { version = "1.12", optional = true }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
ctypst = { version = "0.3", default-features = false, features = ["document-fonts", "pdf", "svg", "measure"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
